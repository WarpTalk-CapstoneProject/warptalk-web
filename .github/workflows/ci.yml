name: web-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:5000
      NEXT_PUBLIC_SIGNALR_URL: http://127.0.0.1:5000
      NEXT_PUBLIC_LIVEKIT_URL: ws://127.0.0.1:7880
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Secret scan for introduced commits
        env:
          SECRET_SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          range="$SECRET_SCAN_BASE..$GITHUB_SHA"
          if [ -z "$SECRET_SCAN_BASE" ] || printf '%s' "$SECRET_SCAN_BASE" | grep -Eq '^0+$'; then
            range=-1
          fi
          docker run --rm \
            -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
            git /repo --log-opts="$range" --redact --exit-code 1 --no-banner
      - name: Immutable workflow and base-image references
        run: |
          if grep -REn 'uses:[[:space:]]+[^[:space:]#]+@(v[0-9]+|main|master|latest)([[:space:]#]|$)' .github/workflows; then
            echo "GitHub Actions must be pinned to full commit SHAs." >&2
            exit 1
          fi
          if ! find . -type f -name 'Dockerfile*' -print0 |
            xargs -0 awk '
              toupper($1) == "FROM" &&
              $2 ~ /[/:]/ &&
              $2 !~ /@sha256:[0-9a-f]{64}$/ {
                print FILENAME ":" FNR ":" $0
                invalid = 1
              }
              END { exit invalid }
            '; then
            echo "External Dockerfile base images must be pinned by digest." >&2
            exit 1
          fi
      - name: Production runtime image security contract
        run: sh scripts/check-runtime-image-security-contract.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:contracts
      # WT-322. A `connection.on("SomethingHappened", …)` handler for an event no
      # server ever sends looks exactly like working code and does nothing — that is
      # how a participant already in the room ended up with no audio and no captions
      # for a whole meeting. Catching it needs both sides of the contract, so this is
      # the one check here that reaches outside this repository: the script lives in
      # warptalk-infrastructure (which owns the cross-repo contracts) and reads the
      # backend's SendAsync calls. Prefer the sibling branch matching this PR's ref so
      # a coordinated change sees its own counterpart; fall back to development.
      - name: Resolve sibling refs for the realtime event contract
        id: sibling-refs
        env:
          WEB_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -eu
          for repo in backend infrastructure; do
            url="https://github.com/WarpTalk-CapstoneProject/warptalk-$repo.git"
            ref=development
            if [ -n "${WEB_REF:-}" ] &&
              git ls-remote --exit-code --heads "$url" "$WEB_REF" >/dev/null 2>&1; then
              ref="$WEB_REF"
            fi
            echo "$repo=$ref" >> "$GITHUB_OUTPUT"
            echo "Validating against warptalk-$repo@$ref"
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-backend
          ref: ${{ steps.sibling-refs.outputs.backend }}
          path: .realtime-contract/warptalk-backend
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: WarpTalk-CapstoneProject/warptalk-infrastructure
          ref: ${{ steps.sibling-refs.outputs.infrastructure }}
          path: .realtime-contract/warptalk-infrastructure
      - name: Realtime event contract
        env:
          WARPTALK_WEB_ROOT: ${{ github.workspace }}
          WARPTALK_BACKEND_ROOT: ${{ github.workspace }}/.realtime-contract/warptalk-backend
        run: |
          node .realtime-contract/warptalk-infrastructure/scripts/check-realtime-event-contract.mjs
      - name: Drop the sibling checkouts before the build
        run: rm -rf .realtime-contract
      - run: npm run build
      - name: Production route contracts
        run: |
          node .next/standalone/server.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ >/dev/null && break
            test "$attempt" -lt 60
            sleep 1
          done
          npm run test:routes
